<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConVFX &amp; Videographer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav class="nav-left">
    <a href="#work">Work</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section class="filters" id="work">
  <button class="active" data-filter="all">All</button>
  <button data-filter="editing">Video Editing</button>
  <button data-filter="videography">Videography</button>
</section>

<section class="work">
  <div class="grid" id="grid"></div>
</section>


<footer id="contact">
  <div class="contact-row">
    <div class="contact-links">
      <a href="mailto:hello@alexrivera.work">hello@alexrivera.work</a>
      <a href="#">Instagram</a>
      <a href="#">Vimeo</a>
      <a href="#">LinkedIn</a>
    </div>
  </div>
  <div class="foot-bottom">
    <span>© 2026 Con</span>
  </div>
</footer>

<script src="projects.js"></script>
<script>
  const grid = document.getElementById('grid');

  function buildGrid(){
    grid.innerHTML = PROJECTS.map(p => `
      <a class="tile" href="project.html?id=${encodeURIComponent(p.id)}" data-cat="${p.category}">
        <div class="still ${p.thumb}">
          <div class="tile-overlay">
            <span class="tile-cat">${categoryLabel(p.category)} <i class="ring"></i></span>
            <span class="tile-year mono">${p.year}</span>
          </div>
        </div>
      </a>
    `).join('');
  }
  buildGrid();

  const buttons = document.querySelectorAll('.filters button');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const f = btn.dataset.filter;
      document.querySelectorAll('.tile').forEach(t => {
        t.classList.toggle('hidden', f !== 'all' && t.dataset.cat !== f);
      });
    });
  });
</script>

</body>
</html>
